<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Inter,Arial,sans-serif">
<rect width="760" height="320" fill="#0d1826"/>
<text x="18" y="24" font-size="12" fill="#6b93ba">Groupe 2 — travail pratique sur matériel physique, salle du département TIC</text>

<rect x="20" y="46" width="200" height="90" rx="10" fill="#182739" stroke="#375983"/>
<text x="36" y="76" font-size="14" font-weight="700" fill="#fff">Machine cliente</text>
<text x="36" y="96" font-size="11" fill="#9db8d5">Réseau privé 192.168.2.0/24</text>
<text x="36" y="112" font-size="11" fill="#9db8d5">Passerelle 192.168.2.254</text>

<rect x="300" y="36" width="190" height="130" rx="10" fill="#182739" stroke="#2177eb"/>
<text x="316" y="64" font-size="14" font-weight="700" fill="#fff">Firewall Linux</text>
<text x="316" y="84" font-size="11" fill="#92cfff">eth1 (interne) · eth0 (externe)</text>
<text x="316" y="102" font-size="11" fill="#9db8d5">IPTABLES + NAT (MASQUERADE)</text>
<text x="316" y="120" font-size="11" fill="#9db8d5">Routage activé (ip_forward)</text>
<text x="316" y="138" font-size="11" fill="#ffb4b4">Port Forwarding → port 80</text>

<rect x="560" y="46" width="180" height="90" rx="10" fill="#182739" stroke="#375983"/>
<text x="576" y="76" font-size="14" font-weight="700" fill="#fff">Réseau public</text>
<text x="576" y="96" font-size="11" fill="#9db8d5">172.16.0.0/16</text>
<text x="576" y="112" font-size="11" fill="#9db8d5">Passerelle 172.16.0.1</text>

<path d="M220 91H300M490 100H560" stroke="#44617f" fill="none" stroke-width="2"/>

<rect x="300" y="190" width="190" height="60" rx="10" fill="#182739" stroke="#375983"/>
<text x="316" y="216" font-size="12" font-weight="700" fill="#fff">Serveur Web (Apache)</text>
<text x="316" y="234" font-size="11" fill="#9db8d5">Réseau privé, port 80</text>
<path d="M375 166V190" stroke="#44617f" fill="none" stroke-width="2"/>

<rect x="560" y="190" width="180" height="70" rx="10" fill="#241a1a" stroke="#e05c5c"/>
<text x="576" y="216" font-size="12" font-weight="700" fill="#ffb4b4">Attaque SYN Flooding</text>
<text x="576" y="234" font-size="11" fill="#e8a7a7">hping3 --syn vers le port 80</text>
<text x="576" y="250" font-size="11" fill="#e8a7a7">forwardé par le Firewall</text>
<path d="M650 190V166" stroke="#e05c5c" fill="none" stroke-width="2" stroke-dasharray="4 3"/>

<text x="18" y="290" font-size="11" fill="#6b93ba">Schéma simplifié réalisé pour ce portfolio, à partir du sujet officiel du projet et de la configuration confirmée par l'étudiante (groupe 2).</text>
