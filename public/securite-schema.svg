<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Inter,Arial,sans-serif">
<rect width="760" height="340" fill="#0d1826"/>
<text x="18" y="24" font-size="12" fill="#6b93ba">Laboratoire isolé — réseau interne 192.168.1.0/24 (machines virtuelles)</text>
<rect x="18" y="44" width="330" height="170" rx="10" fill="none" stroke="#2a3f58" stroke-dasharray="4 3"/>
<rect x="40" y="64" width="130" height="60" rx="8" fill="#241a1a" stroke="#e05c5c"/>
<text x="55" y="88" font-size="13" font-weight="700" fill="#ffb4b4">Kali Linux</text>
<text x="55" y="106" font-size="11" fill="#e8a7a7">Attaquant · 192.168.1.2</text>
<rect x="200" y="64" width="130" height="60" rx="8" fill="#182739" stroke="#2177eb"/>
<text x="215" y="88" font-size="13" font-weight="700" fill="#fff">Metasploitable</text>
<text x="215" y="106" font-size="11" fill="#92cfff">Cible · 192.168.1.5</text>
<rect x="40" y="150" width="130" height="60" rx="8" fill="#182739" stroke="#2177eb"/>
<text x="55" y="174" font-size="13" font-weight="700" fill="#fff">Ubuntu</text>
<text x="55" y="192" font-size="11" fill="#92cfff">Cible · 192.168.1.3</text>
<rect x="200" y="150" width="130" height="60" rx="8" fill="#182739" stroke="#2177eb"/>
<text x="215" y="174" font-size="13" font-weight="700" fill="#fff">Windows</text>
<text x="215" y="192" font-size="11" fill="#92cfff">Cible · 192.168.1.4</text>
<path d="M170 94H200M170 180H200M105 124V150M235 124V150" stroke="#44617f" fill="none"/>
<text x="18" y="238" font-size="12" fill="#6b93ba">Simulation externe — topologie GNS3 avec routeurs (adressage 172.16.0.0/16, d'après le rapport)</text>
<rect x="18" y="254" width="330" height="70" rx="10" fill="none" stroke="#2a3f58" stroke-dasharray="4 3"/>
<rect x="36" y="270" width="90" height="38" rx="6" fill="#182739" stroke="#375983"/><text x="48" y="293" font-size="11" fill="#c9d8ea">Routeur R1</text>
<rect x="150" y="270" width="90" height="38" rx="6" fill="#182739" stroke="#375983"/><text x="163" y="293" font-size="11" fill="#c9d8ea">Routeur R2</text>
<rect x="264" y="270" width="68" height="38" rx="6" fill="#241a1a" stroke="#e05c5c"/><text x="273" y="293" font-size="10" fill="#ffb4b4">Kali</text>
<path d="M126 289H150M240 289H264" stroke="#44617f" fill="none"/>
<rect x="410" y="54" width="320" height="270" rx="10" fill="#141f30" stroke="#2a3f58"/>
<text x="428" y="80" font-size="12" font-weight="700" fill="#fff">Méthodologie suivie</text>
<text x="428" y="106" font-size="11" fill="#9db8d5">1. Reconnaissance réseau (Nmap)</text>
<text x="428" y="128" font-size="11" fill="#9db8d5">2. Attaque par force brute (Hydra)</text>
<text x="428" y="150" font-size="11" fill="#9db8d5">3. Ingénierie sociale / phishing (SET)</text>
<text x="428" y="172" font-size="11" fill="#9db8d5">4. Exploitation d'une vulnérabilité (Metasploit)</text>
<text x="428" y="194" font-size="11" fill="#9db8d5">5. Accès distant (Reverse TCP / Meterpreter)</text>
<text x="428" y="216" font-size="11" fill="#9db8d5">6. Post-exploitation (fichiers, commandes)</text>
<text x="428" y="238" font-size="11" fill="#9db8d5">7. Simulation sur réseau segmenté (GNS3)</text>
<text x="428" y="268" font-size="10" fill="#6b93ba">Environnement entièrement virtualisé,</text>
<text x="428" y="284" font-size="10" fill="#6b93ba">isolé du réseau de production,</text>
<text x="428" y="300" font-size="10" fill="#6b93ba">dans le cadre d'un TP académique encadré.</text>
</svg>
